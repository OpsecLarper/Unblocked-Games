<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vector Asteroids</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .brand h1 { font-size: 22px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
    .stats { display: flex; gap: 14px; font-size: 14px; font-weight: 700; }
    .stat-val { color: #f43f5e; font-variant-numeric: tabular-nums; }
    .canvas-box {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1;
      background: #000000;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="brand"><h1>ASTEROIDS 1979</h1></div>
    <div class="stats">
      <div>SCORE: <span class="stat-val" id="score">0</span></div>
      <div>LIVES: <span class="stat-val" id="lives">♥♥♥</span></div>
    </div>
  </div>

  <div class="canvas-box">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-msg">DEEP SPACE PATROL</h2>
      <button class="btn" onclick="startGame()">ENGAGE THRUSTERS</button>
    </div>
  </div>

  <div class="hint">[↑] Thrust · [←] [→] Rotate · [Space] Fire Lasers</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    function playTone(freq, dur = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    let isPlaying = false;
    let score = 0;
    let lives = 3;
    let animId = null;

    const ship = {
      x: 250,
      y: 250,
      r: 12,
      a: -Math.PI / 2,
      rot: 0,
      thrusting: false,
      vx: 0,
      vy: 0
    };

    let lasers = [];
    let asteroids = [];
    let particles = [];

    function createAsteroid(x, y, r) {
      const vert = Math.floor(Math.random() * 5 + 7);
      const offsets = [];
      for (let i = 0; i < vert; i++) {
        offsets.push(Math.random() * 0.4 + 0.8);
      }
      return {
        x: x,
        y: y,
        r: r,
        a: Math.random() * Math.PI * 2,
        rot: (Math.random() - 0.5) * 0.03,
        vx: (Math.random() - 0.5) * (80 / r),
        vy: (Math.random() - 0.5) * (80 / r),
        vert: vert,
        offsets: offsets
      };
    }

    function initAsteroids() {
      asteroids = [];
      for (let i = 0; i < 5; i++) {
        let x, y;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
        } while (Math.hypot(x - ship.x, y - ship.y) < 120);
        asteroids.push(createAsteroid(x, y, 40));
      }
    }

    function startGame() {
      score = 0;
      lives = 3;
      lasers = [];
      particles = [];
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.vx = 0;
      ship.vy = 0;
      ship.a = -Math.PI / 2;
      initAsteroids();
      updateUI();
      isPlaying = true;
      document.getElementById('overlay').classList.add('hidden');
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    function updateUI() {
      document.getElementById('score').textContent = score;
      let h = '';
      for (let i = 0; i < lives; i++) h += '♥';
      document.getElementById('lives').textContent = h || '0';
    }

    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) ship.rot = -0.08;
      if (['ArrowRight', 'KeyD'].includes(e.code)) ship.rot = 0.08;
      if (['ArrowUp', 'KeyW'].includes(e.code)) ship.thrusting = true;
      if (e.code === 'Space') {
        e.preventDefault();
        shootLaser();
      }
    });

    window.addEventListener('keyup', e => {
      if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) ship.rot = 0;
      if (['ArrowUp', 'KeyW'].includes(e.code)) ship.thrusting = false;
    });

    function shootLaser() {
      if (!isPlaying || lasers.length >= 6) return;
      lasers.push({
        x: ship.x + 4/3 * ship.r * Math.cos(ship.a),
        y: ship.y + 4/3 * ship.r * Math.sin(ship.a),
        vx: 8 * Math.cos(ship.a),
        vy: 8 * Math.sin(ship.a),
        life: 50
      });
      playTone(800, 0.05);
    }

    function addExplosion(x, y, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1.0
        });
      }
    }

    function loop() {
      if (!isPlaying) return;

      // Rotate ship
      ship.a += ship.rot;

      // Thrust ship
      if (ship.thrusting) {
        ship.vx += 0.15 * Math.cos(ship.a);
        ship.vy += 0.15 * Math.sin(ship.a);
      } else {
        ship.vx *= 0.985;
        ship.vy *= 0.985;
      }

      ship.x += ship.vx;
      ship.y += ship.vy;

      // Wrap ship
      if (ship.x < 0) ship.x = canvas.width;
      else if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      else if (ship.y > canvas.height) ship.y = 0;

      // Update Lasers
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x += l.vx;
        l.y += l.vy;
        l.life--;

        // Wrap lasers
        if (l.x < 0) l.x = canvas.width;
        else if (l.x > canvas.width) l.x = 0;
        if (l.y < 0) l.y = canvas.height;
        else if (l.y > canvas.height) l.y = 0;

        if (l.life <= 0) {
          lasers.splice(i, 1);
          continue;
        }

        // Asteroid laser hit
        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (Math.hypot(l.x - a.x, l.y - a.y) < a.r) {
            lasers.splice(i, 1);
            addExplosion(a.x, a.y, a.r > 20 ? 16 : 8);
            playTone(180, 0.15);

            score += a.r > 25 ? 20 : (a.r > 15 ? 50 : 100);
            updateUI();

            if (a.r > 20) {
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
            }
            asteroids.splice(j, 1);
            break;
          }
        }
      }

      // Update Asteroids
      asteroids.forEach(a => {
        a.x += a.vx;
        a.y += a.vy;
        a.a += a.rot;

        if (a.x < 0 - a.r) a.x = canvas.width + a.r;
        else if (a.x > canvas.width + a.r) a.x = 0 - a.r;
        if (a.y < 0 - a.r) a.y = canvas.height + a.r;
        else if (a.y > canvas.height + a.r) a.y = 0 - a.r;

        // Collision with ship
        if (Math.hypot(ship.x - a.x, ship.y - a.y) < ship.r + a.r) {
          addExplosion(ship.x, ship.y, 25);
          playTone(90, 0.3);
          lives--;
          updateUI();
          ship.x = canvas.width / 2;
          ship.y = canvas.height / 2;
          ship.vx = 0;
          ship.vy = 0;
          if (lives <= 0) {
            isPlaying = false;
            document.getElementById('overlay-msg').textContent = 'SHIP DESTROYED';
            document.getElementById('overlay').classList.remove('hidden');
          }
        }
      });

      if (asteroids.length === 0) {
        // Next asteroid round!
        initAsteroids();
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Ship
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(
        ship.x + 4/3 * ship.r * Math.cos(ship.a),
        ship.y + 4/3 * ship.r * Math.sin(ship.a)
      );
      ctx.lineTo(
        ship.x - ship.r * (2/3 * Math.cos(ship.a) + Math.sin(ship.a)),
        ship.y - ship.r * (2/3 * Math.sin(ship.a) - Math.cos(ship.a))
      );
      ctx.lineTo(
        ship.x - ship.r * (2/3 * Math.cos(ship.a) - Math.sin(ship.a)),
        ship.y - ship.r * (2/3 * Math.sin(ship.a) + Math.cos(ship.a))
      );
      ctx.closePath();
      ctx.stroke();

      // Thruster flame
      if (ship.thrusting) {
        ctx.strokeStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(
          ship.x - 4/3 * ship.r * Math.cos(ship.a),
          ship.y - 4/3 * ship.r * Math.sin(ship.a)
        );
        ctx.lineTo(
          ship.x - ship.r * (1/2 * Math.cos(ship.a) + 0.4 * Math.sin(ship.a)),
          ship.y - ship.r * (1/2 * Math.sin(ship.a) - 0.4 * Math.cos(ship.a))
        );
        ctx.lineTo(
          ship.x - ship.r * (1/2 * Math.cos(ship.a) - 0.4 * Math.sin(ship.a)),
          ship.y - ship.r * (1/2 * Math.sin(ship.a) + 0.4 * Math.cos(ship.a))
        );
        ctx.closePath();
        ctx.stroke();
      }

      // Draw Lasers
      ctx.fillStyle = '#f43f5e';
      lasers.forEach(l => {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Asteroids
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1.8;
      asteroids.forEach(a => {
        ctx.beginPath();
        for (let i = 0; i < a.vert; i++) {
          const angle = a.a + (i * Math.PI * 2 / a.vert);
          const rad = a.r * a.offsets[i];
          const x = a.x + rad * Math.cos(angle);
          const y = a.y + rad * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // Draw Particles
      ctx.fillStyle = '#f8fafc';
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 2, 2);
        ctx.globalAlpha = 1.0;
      });
    }

    draw();
  </script>
</body>
</html>
