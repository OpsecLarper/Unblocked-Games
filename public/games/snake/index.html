<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand h1 {
      font-size: 28px;
      font-weight: 800;
      color: #10b981;
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
      letter-spacing: -0.5px;
    }
    .brand p { font-size: 12px; color: #64748b; }
    .stats { display: flex; gap: 8px; }
    .stat-badge {
      background: #131c2e;
      border: 1px solid #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; }
    .stat-num { font-size: 16px; font-weight: 800; color: #38bdf8; font-variant-numeric: tabular-nums; }
    .canvas-box {
      position: relative;
      width: 100%;
      max-width: 460px;
      aspect-ratio: 1;
      background: #0b1120;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 17, 32, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 32px; font-weight: 800; color: #ef4444; }
    .btn {
      background: #10b981;
      color: #042f2e;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:hover { opacity: 0.95; transform: scale(1.02); }
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 240px;
      margin-top: 14px;
    }
    @media (pointer: coarse) {
      .touch-controls { display: grid; }
    }
    .touch-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="brand">
      <h1>CYBER SNAKE</h1>
      <p>Eat energy orbs & avoid collisions</p>
    </div>
    <div class="stats">
      <div class="stat-badge">
        <div class="stat-label">Score</div>
        <div class="stat-num" id="score">0</div>
      </div>
      <div class="stat-badge">
        <div class="stat-label">High</div>
        <div class="stat-num" id="highscore">0</div>
      </div>
    </div>
  </div>

  <div class="canvas-box">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Ready?</h2>
      <p id="overlay-sub" style="color: #94a3b8; font-size: 14px;">Collect glowing dots and beat the record</p>
      <button class="btn" onclick="startGame()">START GAME</button>
    </div>
  </div>

  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" onclick="changeDir('UP')">▲</button>
    <div></div>
    <button class="touch-btn" onclick="changeDir('LEFT')">◀</button>
    <button class="touch-btn" onclick="changeDir('DOWN')">▼</button>
    <button class="touch-btn" onclick="changeDir('RIGHT')">▶</button>
  </div>

  <div class="hint">Use Arrow keys or WASD to navigate</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID_SIZE = 20;
    const TILE_COUNT = 20;

    let snake = [];
    let food = {x: 15, y: 15};
    let dir = 'RIGHT';
    let nextDir = 'RIGHT';
    let score = 0;
    let highscore = parseInt(localStorage.getItem('apex_snake_high') || '0', 10);
    document.getElementById('highscore').textContent = highscore;
    let gameLoop = null;
    let isPlaying = false;
    let particles = [];

    function startGame() {
      snake = [
        {x: 8, y: 10},
        {x: 7, y: 10},
        {x: 6, y: 10}
      ];
      dir = 'RIGHT';
      nextDir = 'RIGHT';
      score = 0;
      particles = [];
      document.getElementById('score').textContent = '0';
      document.getElementById('overlay').classList.add('hidden');
      spawnFood();
      isPlaying = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 90);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function changeDir(newDir) {
      if (newDir === 'UP' && dir !== 'DOWN') nextDir = 'UP';
      if (newDir === 'DOWN' && dir !== 'UP') nextDir = 'DOWN';
      if (newDir === 'LEFT' && dir !== 'RIGHT') nextDir = 'LEFT';
      if (newDir === 'RIGHT' && dir !== 'LEFT') nextDir = 'RIGHT';
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); changeDir('UP'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); changeDir('DOWN'); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); changeDir('LEFT'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); changeDir('RIGHT'); }
      if (e.code === 'Space' && !isPlaying) { startGame(); }
    });

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x * GRID_SIZE + GRID_SIZE / 2,
          y: y * GRID_SIZE + GRID_SIZE / 2,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1.0,
          color: color
        });
      }
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(gameLoop);
      if (score > highscore) {
        highscore = score;
        localStorage.setItem('apex_snake_high', highscore);
        document.getElementById('highscore').textContent = highscore;
      }
      document.getElementById('overlay-title').textContent = 'GAME OVER';
      document.getElementById('overlay-sub').textContent = 'Final Score: ' + score;
      document.getElementById('overlay').classList.remove('hidden');
    }

    function update() {
      dir = nextDir;
      const head = {x: snake[0].x, y: snake[0].y};

      if (dir === 'UP') head.y--;
      if (dir === 'DOWN') head.y++;
      if (dir === 'LEFT') head.x--;
      if (dir === 'RIGHT') head.x++;

      // Collision with wall
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        createExplosion(head.x, head.y, '#ef4444');
        return gameOver();
      }

      // Collision with self
      for (let seg of snake) {
        if (head.x === seg.x && head.y === seg.y) {
          createExplosion(head.x, head.y, '#ef4444');
          return gameOver();
        }
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        createExplosion(food.x, food.y, '#10b981');
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#0b1120';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle Grid lines
      ctx.strokeStyle = '#15203b';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // Draw Food
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#10b981';
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw Snake
      snake.forEach((segment, index) => {
        ctx.save();
        if (index === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#38bdf8';
        } else {
          ctx.fillStyle = index % 2 === 0 ? '#0284c7' : '#0369a1';
          ctx.shadowBlur = 0;
        }
        ctx.beginPath();
        ctx.roundRect(
          segment.x * GRID_SIZE + 1.5,
          segment.y * GRID_SIZE + 1.5,
          GRID_SIZE - 3,
          GRID_SIZE - 3,
          index === 0 ? 5 : 3
        );
        ctx.fill();
        ctx.restore();
      });

      // Draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1.0;
      }
    }

    draw();
  </script>
</body>
</html>
