<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .wrapper {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 14px;
    }
    .counter {
      font-family: monospace;
      font-size: 26px;
      font-weight: 800;
      color: #ef4444;
      background: #000;
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 60px;
      text-align: center;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: 2px solid #475569;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:active { background: #1e293b; }
    .grid {
      display: grid;
      gap: 2px;
      background: #334155;
      padding: 4px;
      border-radius: 6px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      border-radius: 2px;
      border-top: 2px solid #64748b;
      border-left: 2px solid #64748b;
      border-right: 2px solid #334155;
      border-bottom: 2px solid #334155;
    }
    .cell.revealed {
      background: #1e293b;
      border: 1px solid #334155;
      cursor: default;
    }
    .cell.mine { background: #ef4444 !important; }
    .cell.c1 { color: #38bdf8; }
    .cell.c2 { color: #22c55e; }
    .cell.c3 { color: #f43f5e; }
    .cell.c4 { color: #818cf8; }
    .cell.c5 { color: #ea580c; }
    .cell.c6 { color: #06b6d4; }
    .cell.c7 { color: #e2e8f0; }
    .cell.c8 { color: #94a3b8; }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <div class="counter" id="mines-left">010</div>
      <button class="face-btn" id="face" onclick="initGame()">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="hint">Left-Click to Reveal · Right-Click to Place Flag 🚩</div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const TOTAL_MINES = 10;

    let board = [];
    let revealedCount = 0;
    let flagsCount = 0;
    let isGameOver = false;
    let timer = 0;
    let timerId = null;
    let firstClick = true;

    function initGame() {
      if (timerId) clearInterval(timerId);
      timer = 0;
      isGameOver = false;
      firstClick = true;
      flagsCount = 0;
      revealedCount = 0;
      document.getElementById('face').textContent = '🙂';
      document.getElementById('timer').textContent = '000';
      document.getElementById('mines-left').textContent = String(TOTAL_MINES).padStart(3, '0');

      board = [];
      for (let r = 0; r < ROWS; r++) {
        let row = [];
        for (let c = 0; c < COLS; c++) {
          row.push({
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0
          });
        }
        board.push(row);
      }

      render();
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < TOTAL_MINES) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        if (!board[r][c].mine && (Math.abs(r - safeR) > 1 || Math.abs(c - safeC) > 1)) {
          board[r][c].mine = true;
          planted++;
        }
      }

      // Count neighbors
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].mine) {
            let cnt = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                  cnt++;
                }
              }
            }
            board[r][c].count = cnt;
          }
        }
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;
      grid.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          const div = document.createElement('div');
          div.className = 'cell' + (cell.revealed ? ' revealed' : '');
          if (cell.revealed) {
            if (cell.mine) {
              div.className += ' mine';
              div.textContent = '💣';
            } else if (cell.count > 0) {
              div.className += ' c' + cell.count;
              div.textContent = cell.count;
            }
          } else if (cell.flagged) {
            div.textContent = '🚩';
          }

          div.addEventListener('click', () => handleClick(r, c));
          div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleRightClick(r, c);
          });
          grid.appendChild(div);
        }
      }
    }

    function handleClick(r, c) {
      if (isGameOver) return;
      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        plantMines(r, c);
        timerId = setInterval(() => {
          timer++;
          document.getElementById('timer').textContent = String(Math.min(999, timer)).padStart(3, '0');
        }, 1000);
      }

      if (cell.mine) {
        // Boom!
        cell.revealed = true;
        isGameOver = true;
        clearInterval(timerId);
        document.getElementById('face').textContent = '😵';
        // Reveal all mines
        board.forEach(row => row.forEach(cl => {
          if (cl.mine) cl.revealed = true;
        }));
        render();
        return;
      }

      reveal(r, c);
      render();

      if (revealedCount === ROWS * COLS - TOTAL_MINES) {
        isGameOver = true;
        clearInterval(timerId);
        document.getElementById('face').textContent = '😎';
      }
    }

    function reveal(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged || cell.mine) return;

      cell.revealed = true;
      revealedCount++;

      if (cell.count === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            reveal(r + dr, c + dc);
          }
        }
      }
    }

    function handleRightClick(r, c) {
      if (isGameOver) return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      flagsCount += cell.flagged ? 1 : -1;
      document.getElementById('mines-left').textContent = String(Math.max(0, TOTAL_MINES - flagsCount)).padStart(3, '0');
      render();
    }

    initGame();
  </script>
</body>
</html>
