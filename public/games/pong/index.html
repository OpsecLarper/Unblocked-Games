<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .brand h1 { font-size: 22px; font-weight: 800; color: #38bdf8; letter-spacing: 2px; }
    .modes { display: flex; gap: 6px; }
    .mode-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }
    .court-box {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 16 / 10;
      background: #030712;
      border: 3px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 32px; font-weight: 800; color: #38bdf8; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="brand"><h1>RETRO PONG</h1></div>
    <div class="modes">
      <button class="mode-btn active" id="btn-1p" onclick="setMode('1P')">1P vs CPU</button>
      <button class="mode-btn" id="btn-2p" onclick="setMode('2P')">2P Local</button>
    </div>
  </div>

  <div class="court-box">
    <canvas id="gameCanvas" width="520" height="325"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-msg">FIRST TO 7 WINS</h2>
      <button class="btn" onclick="startGame()">START MATCH</button>
    </div>
  </div>

  <div class="hint" id="controls-hint">P1: [W] [S] or Mouse · First to 7 Points</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    function playBeep(freq = 440) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch(e) {}
    }

    let mode = '1P'; // '1P' or '2P'
    let isPlaying = false;
    let scoreL = 0;
    let scoreR = 0;
    let animId = null;

    const paddleH = 60;
    const paddleW = 10;
    let paddleL = { y: 130, vy: 0 };
    let paddleR = { y: 130, vy: 0 };

    let ball = {
      x: 260,
      y: 162,
      r: 6,
      vx: 4.5,
      vy: 2.5
    };

    let keys = {};

    function setMode(m) {
      mode = m;
      document.getElementById('btn-1p').classList.toggle('active', m === '1P');
      document.getElementById('btn-2p').classList.toggle('active', m === '2P');
      document.getElementById('controls-hint').textContent = m === '1P'
        ? 'P1: [W] [S] or Mouse · First to 7 Points'
        : 'P1: [W] [S] · P2: [↑] [↓] · First to 7 Points';
      startGame();
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() - 0.5) * Math.PI / 4;
      const speed = 4.8;
      ball.vx = Math.cos(angle) * speed * direction;
      ball.vy = Math.sin(angle) * speed;
    }

    function startGame() {
      scoreL = 0;
      scoreR = 0;
      paddleL.y = canvas.height / 2 - paddleH / 2;
      paddleR.y = canvas.height / 2 - paddleH / 2;
      resetBall(Math.random() > 0.5 ? 1 : -1);
      isPlaying = true;
      document.getElementById('overlay').classList.add('hidden');
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = ((e.clientY - rect.top) / rect.height) * canvas.height;
      paddleL.y = Math.max(0, Math.min(canvas.height - paddleH, mouseY - paddleH / 2));
    });

    function loop() {
      if (!isPlaying) return;

      // P1 movement via keys
      if (keys['KeyW']) paddleL.y = Math.max(0, paddleL.y - 6);
      if (keys['KeyS']) paddleL.y = Math.min(canvas.height - paddleH, paddleL.y + 6);

      // P2 or CPU
      if (mode === '2P') {
        if (keys['ArrowUp']) paddleR.y = Math.max(0, paddleR.y - 6);
        if (keys['ArrowDown']) paddleR.y = Math.min(canvas.height - paddleH, paddleR.y + 6);
      } else {
        // AI Logic
        const target = ball.y - paddleH / 2;
        const diff = target - paddleR.y;
        paddleR.y += diff * 0.085;
        paddleR.y = Math.max(0, Math.min(canvas.height - paddleH, paddleR.y));
      }

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/bottom bounce
      if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.vy = -ball.vy;
        playBeep(300);
      } else if (ball.y + ball.r > canvas.height) {
        ball.y = canvas.height - ball.r;
        ball.vy = -ball.vy;
        playBeep(300);
      }

      // Left paddle hit
      if (ball.x - ball.r <= 25 && ball.x - ball.r >= 15) {
        if (ball.y >= paddleL.y && ball.y <= paddleL.y + paddleH) {
          ball.x = 25 + ball.r;
          let hit = (ball.y - (paddleL.y + paddleH / 2)) / (paddleH / 2);
          let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) * 1.05;
          ball.vx = Math.cos(hit * 0.7) * speed;
          ball.vy = Math.sin(hit * 0.7) * speed;
          playBeep(480);
        }
      }

      // Right paddle hit
      if (ball.x + ball.r >= canvas.width - 25 && ball.x + ball.r <= canvas.width - 15) {
        if (ball.y >= paddleR.y && ball.y <= paddleR.y + paddleH) {
          ball.x = canvas.width - 25 - ball.r;
          let hit = (ball.y - (paddleR.y + paddleH / 2)) / (paddleH / 2);
          let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) * 1.05;
          ball.vx = -Math.cos(hit * 0.7) * speed;
          ball.vy = Math.sin(hit * 0.7) * speed;
          playBeep(480);
        }
      }

      // Score check
      if (ball.x < 0) {
        scoreR++;
        playBeep(200);
        if (scoreR >= 7) return finishMatch(mode === '2P' ? 'PLAYER 2 WINS!' : 'CPU WINS!');
        resetBall(1);
      } else if (ball.x > canvas.width) {
        scoreL++;
        playBeep(600);
        if (scoreL >= 7) return finishMatch('PLAYER 1 WINS!');
        resetBall(-1);
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function finishMatch(msg) {
      isPlaying = false;
      document.getElementById('overlay-msg').textContent = msg;
      document.getElementById('overlay').classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scores
      ctx.font = '700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
      ctx.fillStyle = '#1e293b';
      ctx.fillText(scoreL, canvas.width / 4, 60);
      ctx.fillText(scoreR, (canvas.width / 4) * 3, 60);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(15, paddleL.y, paddleW, paddleH);
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(canvas.width - 15 - paddleW, paddleR.y, paddleW, paddleH);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    draw();
  </script>
</body>
</html>
